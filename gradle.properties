# Gradle options ONLY. Everything else lives in stonecutter.properties.toml.
#
# In particular `loomx.loom_version` must NOT be added here: it would put fabric-loom
# on every node's buildscript classpath and break the Phase B Architectury Loom node
# (design R-01). It lives in stonecutter.properties.toml.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false
