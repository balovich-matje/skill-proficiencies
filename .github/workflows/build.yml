# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # Multi-version workspace: an unqualified task name runs in every node.
      # buildAndCollect additionally gathers each node's jar into build/libs/<version>/.
      # No stonecutterSwitch loop is needed — building a non-active node pulls
      # stonecutterPrepare/Generate in automatically (R-18, measured).
      # JDK 25 is the *Gradle* JVM; the toolchain block provisions 17/21 per node.
      - name: build
        run: ./gradlew buildAndCollect
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
