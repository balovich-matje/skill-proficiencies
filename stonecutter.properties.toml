# THE single source of version truth for every node.
# A balance release edits `mod.version` here, once. Nothing else.
# Gradle-only options live in gradle.properties; everything else lives here.

mod.id = "specialities"
mod.name = "Skill Proficiencies"
mod.group = "com.specialities"
mod.version = "1.6.1"

deps.fabric_loader = "0.19.3"

# R-01, MEASURED — `loomx.loom_version` must be visible to FABRIC nodes ONLY, hence this
# bare `[fabric]` table. It used to sit in the root of this file, and the note that used to
# be here claimed only the root `gradle.properties` was dangerous. That was half right: the
# TOML ROOT is just as bad, and it broke every Architectury Loom node with
# "Unresolved reference: platform".
#
# WHY: `dev.kikugie.loom-back-compat` 0.4.1 is a SETTINGS plugin. It registers
# `settings.gradle.beforeProject { configureClasspath() }` (LoomCompatPlugin.kt:56), and
# `configureClasspath` (:72-80, :209-215) adds BOTH `net.fabricmc.fabric-loom` and
# `net.fabricmc.fabric-loom-remap` to that project's buildscript classpath whenever
# `extra.has("loomx.loom_version")`. Stonecutter writes structured properties straight into
# each node project's ExtraPropertiesExtension (StructuredPropertiesProvider.kt:68-69), and
# a ROOT-level key here needs no tag — so it reaches every node, forge included.
#
# The controller tags properties with `(version, loader)`, so under `[fabric]` the key
# shortens back to `loomx.loom_version` on a fabric node and stays `fabric.loomx.loom_version`
# everywhere else. Measured, one loom per node:
#   > Configure project :1.20.1-fabric    Fabric Loom: 1.17.17
#   > Configure project :1.20.1-forge     Architectury Loom: 1.17.491
# Evidence: scratchpad/phase-b-prep/probe-r01.log (the break) + probe-r01-fix.log (the fix).
#
# Corollary unchanged: do not put it in `gradle.properties` either, root or per-node.
[fabric]
loomx.loom_version = "1.17.17"

["26.2"]
# Game versions this node's jar is marked compatible with on Modrinth/CurseForge.
mod.mc_releases = ["26.2"]

[fabric."26.2"]
mod.mc_compat = "~26.2"
mod.loader_floor = ">=0.19.3"
deps.fabric_api = "0.155.2+26.2"
deps.modmenu = "20.0.1"
deps.cloth_config = "26.2.155+fabric"

["26.1"]
mod.mc_releases = ["26.1", "26.1.1", "26.1.2"]

[fabric."26.1"]
mod.mc_compat = "~26.1"
mod.loader_floor = ">=0.19.3"
deps.fabric_api = "0.154.2+26.1.2"
deps.modmenu = "18.0.0"
deps.cloth_config = "26.1.154+fabric"

["1.21.11"]
mod.mc_releases = ["1.21.11"]

[fabric."1.21.11"]
mod.mc_compat = "1.21.11"
# NOT `>=0.19.3` — see the note below. fabric-api 0.141.5 already demands 0.17.3,
# which bundles MixinExtras 0.5.0, so this floor costs the legacy audience nothing.
mod.loader_floor = ">=0.17.3"
deps.fabric_api = "0.141.5+1.21.11"
# No modmenu/cloth_config keys: the optional config UI is gated to >=26.1 in
# build.fabric.gradle.kts, so this node must not declare them.

["1.21.1"]
# The jar covers both patch releases of 1.21 (the mod's own surface is identical).
mod.mc_releases = ["1.21", "1.21.1"]

[fabric."1.21.1"]
mod.mc_compat = ">=1.21 <=1.21.1"
# `mod.loader_floor` is a REAL finding here, not boilerplate, and 1.21.1 is the one
# node where it is NOT just fabric-api's own floor. The mod uses one @WrapMethod
# (PlayerMixin's MeleeSwing gate), which needs MixinExtras >= 0.4.0; loader BUNDLES
# MixinExtras (0.15.11 -> 0.3.5, 0.16.3 -> 0.4.1, 0.16.10 -> 0.4.1, 0.17.3 -> 0.5.0,
# 0.19.3 -> 0.5.4). Every module of fabric-api 0.116.14+1.21.1 declares only
# `fabricloader >=0.15.11` (read out of the resolved module jars' own fabric.mod.json,
# not from the docs), which bundles MixinExtras 0.3.5 and has no @WrapMethod at all —
# so taking fabric-api's floor would turn "update your loader" into a cryptic
# mixin-apply crash. Hence >=0.16.3, the lowest loader that bundles >= 0.4.0.
# Equally: do NOT copy 26.x's `>=0.19.3` downward, it locks out the legacy audience.
mod.loader_floor = ">=0.16.3"
deps.fabric_api = "0.116.14+1.21.1"
# No modmenu/cloth_config keys: the optional config UI is gated to >=26.1 in
# build.fabric.gradle.kts, so this node must not declare them.

[neoforge."1.21.1"]
# NOT `mod.mc_compat`: that key holds FABRIC range syntax (">=1.21 <=1.21.1"), and
# neoforge.mods.toml wants a MAVEN range. The loader-axis nodes therefore get their own key,
# read by build.neoforge.gradle.kts as `${minecraft_range}`.
mod.mc_range = "[1.21,1.21.2)"
# ModDevGradle 2.0.142 + this pin trial-compiled on this machine
# (scratchpad/phase-b-prep/trial-neoforge, BUILD SUCCESSFUL in 1m 44s from cold).
# The FLOOR is a real finding, not the latest number for its own sake: attachment SYNC —
# which is what `specialities:skills` needs to reach the owning client — landed in
# NeoForge >= 21.1.200, so anything below that pin cannot host this mod.
deps.neoforge = "21.1.243"
# No `mod.loader_floor`/`deps.fabric_api`/`deps.fabric_loader` here: those are Fabric's, and
# `deps.fabric_loader` sits in the root only because every Fabric node shares one value.

["1.20.1"]
# The jar covers both patch releases of 1.20 (the mod's own surface is identical).
mod.mc_releases = ["1.20", "1.20.1"]

[fabric."1.20.1"]
mod.mc_compat = ">=1.20 <=1.20.1"
# fabric-api's OWN floor here, unlike 1.21.1: every module of 0.92.11+1.20.1 declares
# `fabricloader >=0.16.10`, which bundles MixinExtras 0.4.1 — enough for the one
# @WrapMethod (PlayerMixin's MeleeSwing gate, needs >= 0.4.0). So no floor of our own
# is required and none is invented. Do NOT copy 26.x's `>=0.19.3` downward.
mod.loader_floor = ">=0.16.10"
# Tip of the 0.92 line, checked against
# https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml on
# 2026-07-25: 0.92.0 … 0.92.11 are the only `+1.20.1` versions and 0.92.11 is the
# highest. The 0.92 line is fabric-api's long-term 1.20.1 branch; the `<release>` of
# the whole artifact is 0.155.3+26.3 and is irrelevant here.
deps.fabric_api = "0.92.11+1.20.1"
# No modmenu/cloth_config keys: the optional config UI is gated to >=26.1 in
# build.fabric.gradle.kts, so this node must not declare them.

[forge."1.20.1"]
# Maven range, not Fabric's `mod.mc_compat` syntax — see the note under [neoforge."1.21.1"].
mod.mc_range = "[1.20,1.20.2)"
# The version string WITHOUT the `1.20.1-` prefix: build.forge.gradle.kts assembles the
# coordinate as `net.minecraftforge:forge:${sc.current.version}-${deps.forge}`.
# Architectury Loom 1.17.491 + this pin trial-compiled on this machine
# (scratchpad/phase-b-prep/trial-forge, BUILD SUCCESSFUL in 16s).
deps.forge = "47.4.22"
# The mods.toml FLOOR is deliberately looser than the compile pin: 47.4.22 was
# latest-at-scoping, not a functional requirement (no R-finding depends on it), and
# launcher metas lag the Forge maven — the Modrinth App installs 47.4.20 today, which
# would have refused a [47.4.22,) mod for no reason. Any Forge 47 (MC 1.20.1) works.
deps.forge_floor = "47"
# R-10: LexForge bundles NO MixinExtras — measured, forge-1.20.1-47.4.22-userdev.jar's own
# config.json lists `org.spongepowered:mixin:0.8.5` and zero llamalad7 entries — so the mod's
# @WrapMethod/@WrapOperation/@ModifyReturnValue/@Local usage has to be jar-in-jar'd. 0.5.4 is
# what fabric-loader 0.19.3 bundles, i.e. the same library the 26.x nodes run against.
deps.mixinextras = "0.5.4"
# `loom.platform=forge` deliberately does NOT live here: Arch Loom reads it during plugin
# apply, before Stonecutter's properties exist. It is in versions/1.20.1-forge/gradle.properties.
