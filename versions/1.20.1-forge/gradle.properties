# PER-NODE property file, and the only one in the tree. Architectury Loom reads
# `loom.platform` during PLUGIN APPLY — the same timing window R-01 lives in — and a
# project's own gradle.properties is loaded before any `beforeProject` callback runs, so this
# is the one place the value is guaranteed early enough. Proven in
# scratchpad/phase-b-prep/probe-r01-fix.log ("FORGE NODE: loom.platform=FORGE").
#
# The alternative, a `loom.platform` key under `[forge."1.20.1"]` in
# stonecutter.properties.toml, was NOT taken and NOT tested: Stonecutter writes structured
# properties into the project's ExtraPropertiesExtension from a `beforeProject` callback,
# which is later than plugin apply.
#
# Nothing else belongs here. Version pins live in stonecutter.properties.toml; Gradle options
# live in the ROOT gradle.properties (and `loomx.loom_version` lives in neither — R-01).
loom.platform=forge
